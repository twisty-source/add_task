{% extends "tasks/base.html" %}
{% load bootstrap4 %}

{% block page_header %}
  <div class="text-center">
    <h1 class="h2 font-weight-bold mb-1">Регистрация</h1>
    <p class="text-muted">Создайте аккаунт и начните организовывать свои дела</p>
  </div>
{% endblock page_header %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="post" action="{% url 'users:register' %}" class="form">
            {% csrf_token %}
            {% bootstrap_form form %}
            <button name="submit" class="btn btn-success btn-block font-weight-bold py-2 mt-3">
              Зарегистрироваться
            </button>
            <input type="hidden" name="next" value="{% url 'tasks:task_list' %}"/>
          </form>

          <hr class="my-4">
          <p class="text-center text-muted mb-0 small">
            Уже зарегистрированы?
            <a href="{% url 'users:login' %}" class="font-weight-bold">Войти</a>
          </p>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
